<style>body{margin:0}
:root { color-scheme: dark; --night: #16213E; --deep: #0E152C; --txt: #F3F5FF; --txt-2: #A9B4D0; --star: #FFD166; --ink: #16213E; --rim: #34457A; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--txt); font-family: "Noto Sans TC", "PingFang TC", sans-serif; background: radial-gradient(ellipse at 50% 30%, #23305F 0%, var(--night) 55%, var(--deep) 100%); background-color: var(--night); min-height: 100vh; min-height: 100dvh; }
.sky { position: fixed; inset: 0; pointer-events: none; }
.sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .7; animation: tw 3s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .sky i, .guru { animation: none !important; } }
.note { position: relative; z-index: 2; margin: 12px auto 0; max-width: 520px; padding: 10px 14px; border: 1px dashed var(--rim); border-radius: 12px; font-size: 13px; color: var(--txt-2); display: flex; flex-direction: column; gap: 8px; }
.wrap-n { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sw { display: flex; gap: 8px; flex-wrap: wrap; }
.sw button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rim); background: transparent; color: var(--txt); cursor: pointer; }
.sw button[aria-pressed="true"] { background: var(--star); border-color: var(--star); color: var(--ink); font-weight: 700; }
main { position: relative; z-index: 1; min-height: 80vh; min-height: 80dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.guru { width: 150px; max-width: 45vw; height: auto; border-radius: 34px; animation: fl 4s ease-in-out infinite; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
@keyframes fl { 50% { transform: translateY(-8px); } }
.eb { font-size: 13px; letter-spacing: .35em; color: var(--txt-2); margin: 6px 0 -10px; }
h1 { font-family: "Huninn", "Noto Sans TC", sans-serif; font-weight: 400; font-size: 42px; margin: 0; text-wrap: balance; }
p.msg { margin: 0; font-size: 18px; line-height: 1.7; color: var(--txt); max-width: 22em; }
.go { display: inline-block; margin-top: 6px; padding: 14px 36px; border-radius: 999px; background: var(--star); color: var(--ink); font-weight: 700; font-size: 18px; text-decoration: none; }
[hidden] { display: none !important; }
.go:focus-visible, .sw button:focus-visible { outline: 3px solid var(--star); outline-offset: 3px; }
</style>
