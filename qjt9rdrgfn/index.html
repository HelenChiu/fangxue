/* Layout concept: a school exercise book. Grid-paper ground, teacher's red pen for marks,
   one 米字格 tile per subject. Kid screens are big and single-task; the parent area is a quiet form. */
:root {
  --paper: #F2F6F3;
  --card: #FFFFFF;
  --grid: #DCE7E1;
  --ink: #15303A;
  --ink-soft: #4F6A72;
  --line: #C3D4CC;
  --pencil: #F2B705;
  --pencil-ink: #3A2D00;
  --red: #D6453D;
  --blue: #2D6BCF;
  --green: #1F8F5B;
  --amber: #B25E00;
  --violet: #7446C2;
  --on-solid: #FFFFFF;
  --font-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }

.app {
  max-width: 920px; margin: 0 auto;
  padding-block: 20px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand h1 { font-size: 26px; }
.brand small { display: block; color: var(--ink-soft); font-size: 13px; }
.stars { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 20px;
  background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 10px; font-variant-numeric: tabular-nums; }
.stars svg { width: 22px; height: 22px; fill: var(--pencil); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }

/* 米字格 tile */
.mi { --c: var(--ink); position: relative; flex: none; width: 56px; height: 56px; border: 2px solid var(--c); background: var(--card);
  display: grid; place-items: center; font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--c); }
.mi::before, .mi::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .28; }
.mi::before { background:
  linear-gradient(to right, transparent calc(50% - .5px), var(--c) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
  linear-gradient(to bottom, transparent calc(50% - .5px), var(--c) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)); }
.mi::after { background:
  linear-gradient(to top right, transparent calc(50% - .5px), var(--c) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
  linear-gradient(to bottom right, transparent calc(50% - .5px), var(--c) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)); }
.mi span { position: relative; z-index: 1; }
.mi.big { width: 84px; height: 84px; font-size: 46px; }

.nav { display: flex; gap: 8px; flex-wrap: wrap; }
.nav button { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 8px 18px; min-height: 44px; font-weight: 500; }
.nav button[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.nav .count { font-variant-numeric: tabular-nums; opacity: .8; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 22px;
  border-radius: 12px; border: 2px solid var(--ink); background: var(--card); font-weight: 700; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--pencil); color: var(--pencil-ink); border-color: var(--pencil-ink); box-shadow: 0 3px 0 var(--pencil-ink); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--pencil-ink); }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.panel { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: 14px; }
.title-lg { font-size: 28px; }

/* subject tiles */
.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.subj { text-align: left; display: flex; flex-direction: column; gap: 14px; padding: 18px; border: 2px solid var(--c); border-radius: 16px;
  background: color-mix(in srgb, var(--c) 12%, var(--card)); min-width: 0; }
.subj .mi { --c: var(--c); border-color: var(--c); }
.subj h2 { font-size: 24px; color: var(--ink); }
.subj .meta { color: var(--ink-soft); font-size: 14px; }
.subj:hover { transform: translateY(-2px); }
.red { --c: var(--red); } .blue { --c: var(--blue); } .green { --c: var(--green); } .amber { --c: var(--amber); } .violet { --c: var(--violet); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 16px; min-height: 40px; }
.chip[aria-pressed="true"] { border-color: var(--c, var(--ink)); background: color-mix(in srgb, var(--c, var(--ink)) 16%, var(--card)); font-weight: 700; }

.modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.mode { text-align: left; padding: 18px; border: 2px solid var(--ink); border-radius: 16px; background: var(--card); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mode h3 { font-size: 22px; }
.mode:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }

/* game */
.gamebar { display: flex; align-items: center; gap: 14px; }
.steps { flex: 1; display: flex; gap: 6px; min-width: 0; }
.step { flex: 1; height: 12px; border: 2px solid var(--ink); border-radius: 3px; background: var(--card); }
.step.done { background: var(--c, var(--green)); border-color: var(--c, var(--green)); }
.step.now { background: var(--pencil); }
.qcard { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.qtag { color: var(--ink-soft); font-size: 14px; }
.qtext { font-size: 26px; line-height: 1.5; font-family: var(--font-display); overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 60px; padding: 10px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); font-size: 20px; overflow-wrap: anywhere; }
.opt .no { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink-soft); display: grid; place-items: center; font-size: 16px; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt.ok { border-color: var(--green); background: color-mix(in srgb, var(--green) 18%, var(--card)); }
.opt.no-ok { border-color: var(--red); background: color-mix(in srgb, var(--red) 14%, var(--card)); }
.fillrow { display: flex; gap: 10px; flex-wrap: wrap; }
.fillrow input { flex: 1; min-width: 140px; font-size: 26px; min-height: 60px; padding: 6px 16px; border: 2px solid var(--ink); border-radius: 14px; background: var(--paper); }
.fb { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--line); }
.fb.good { border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--card)); }
.fb.bad { border-color: var(--red); background: color-mix(in srgb, var(--red) 10%, var(--card)); }
.fb b { font-family: var(--font-display); font-weight: 400; font-size: 22px; }

.sky { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 28px 18px; padding: 26px 8px 18px;
  background: color-mix(in srgb, var(--blue) 10%, var(--card)); border: 2px solid var(--line); border-radius: 16px; min-height: 220px; }
.balloon { position: relative; border: 2px solid var(--ink); border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; min-width: 110px; max-width: 46%; min-height: 96px;
  padding: 18px 20px; font-size: 20px; font-weight: 700; color: var(--ink); background: var(--bc); animation: bob 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); overflow-wrap: anywhere; }
.balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 26px; background: var(--ink-soft); }
.balloon.b0 { --bc: color-mix(in srgb, var(--red) 40%, var(--card)); }
.balloon.b1 { --bc: color-mix(in srgb, var(--blue) 40%, var(--card)); }
.balloon.b2 { --bc: color-mix(in srgb, var(--green) 40%, var(--card)); }
.balloon.b3 { --bc: color-mix(in srgb, var(--pencil) 55%, var(--card)); }
.balloon.gone { opacity: .3; animation: none; transform: scale(.85); pointer-events: none; }
.balloon.pop { animation: pop .35s ease-out forwards; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes pop { to { transform: scale(1.35); opacity: 0; } }

.memgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mem { min-height: 92px; border: 2px solid var(--ink); border-radius: 14px; font-size: 19px; font-weight: 700; padding: 6px; display: grid; place-items: center; text-align: center; overflow-wrap: anywhere;
  background: repeating-linear-gradient(45deg, var(--ink) 0 6px, color-mix(in srgb, var(--ink) 85%, var(--paper)) 6px 12px); color: transparent; }
.mem.up { background: var(--card); color: var(--ink); }
.mem.hit { background: color-mix(in srgb, var(--green) 25%, var(--card)); border-color: var(--green); color: var(--ink); }

.stamp { align-self: center; width: 150px; height: 150px; border: 6px solid var(--red); border-radius: 50%; color: var(--red); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 46px; transform: rotate(-8deg); font-variant-numeric: tabular-nums; }
.mistake { border-top: 2px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 2px; }

/* parent area */
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-weight: 700; }
input[type=text], textarea { width: 100%; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); }
textarea { min-height: 110px; resize: vertical; }
.drop { border: 2px dashed var(--ink-soft); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.thumb { position: relative; width: 96px; }
.thumb img { width: 96px; height: 120px; object-fit: cover; border-radius: 8px; border: 2px solid var(--ink); display: block; }
.thumb button { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); line-height: 1; padding: 0; }
.msg { padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); }
.msg.err { border-color: var(--red); color: var(--red); }
.qitem { display: flex; gap: 12px; align-items: flex-start; border-top: 1px solid var(--line); padding-top: 10px; }
.qitem input { width: 22px; height: 22px; margin-top: 4px; flex: none; }
.unit-row { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.tag { display: inline-block; border: 2px solid var(--c, var(--ink)); color: var(--c, var(--ink)); border-radius: 999px; padding: 0 10px; font-size: 13px; font-weight: 700; }
.links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.links a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; color: var(--ink); text-decoration: none; background: var(--paper); min-width: 0; }
.links a:hover { border-color: var(--ink); }
.links a span { color: var(--ink-soft); font-size: 13px; }
ul.plain { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper);
  padding: 10px 18px; border-radius: 999px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 640px) {
  .subjects, .modes, .links { grid-template-columns: 1fr; }
  .subj { flex-direction: row; align-items: center; }
  .qtext { font-size: 22px; }
  .balloon { max-width: 100%; }
  .brand h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .balloon { animation: none; } .subj:hover { transform: none; } }

/* ===== v4: zones, paper mode, pads, A4 ===== */
.app { max-width: 1040px; }
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
.topbar .homebtn { min-width: 0; flex: 1 1 auto; max-width: max-content; }
.topbar .homebtn small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
@media screen { #printhost { display: none; } }
.homebtn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 14px 6px 8px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); text-align: left; }
.homebtn svg { width: 26px; height: 26px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.homebtn h1 { font-size: 22px; }
.homebtn small { color: var(--ink-soft); font-size: 12px; display: block; }

.zone h2 { font-size: 21px; }
.zone p { color: var(--ink-soft); font-size: 14px; }
.intro { border: 2px solid var(--ink); border-radius: 16px; background: var(--card); padding: 18px; display: flex; flex-direction: column; gap: 10px; }

.intro dt { font-weight: 700; color: var(--ink-soft); }
.intro dd { margin: 0; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.sbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); }

.sbar .timer.low { color: var(--red); }
.sbar .grow { flex: 1; }
.pq { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pq.right { border-color: var(--green); } .pq.wrong { border-color: var(--red); }
.pqh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.pqh .no { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 700; }
.ptype { border: 2px solid var(--c, var(--ink-soft)); color: var(--ink); border-radius: 999px; padding: 0 10px; font-weight: 700; }
.ref { color: var(--ink-soft); }
.pbody { display: flex; flex-direction: column; gap: 12px; }
.pq .qt { font-size: 21px; line-height: 1.6; font-family: var(--font-display); white-space: pre-line; overflow-wrap: anywhere; }

.opt.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, var(--card)); font-weight: 700; }
.chipsq { display: flex; gap: 8px; flex-wrap: wrap; }
.chipsq .opt { min-height: 54px; min-width: 58px; justify-content: center; padding: 6px 14px; font-size: 24px; }
.big-em { font-size: 72px; line-height: 1.1; }
.zy { font-size: 18px; letter-spacing: .08em; color: var(--blue); }
.segs { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-display); font-size: 22px; }
.seg1 { border: 2px dashed var(--line); background: var(--paper); border-radius: 10px; padding: 4px 10px; min-height: 44px; }
.seg1.sel { border: 2px solid var(--red); background: color-mix(in srgb, var(--red) 14%, var(--card)); color: var(--red); font-weight: 700; }
.seg1.ans { border: 2px solid var(--green); background: color-mix(in srgb, var(--green) 16%, var(--card)); }
.idiomsel { display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; }
.idiomsel .qt { flex: 1; min-width: 0; }
.idiomsel select { flex: none; }
.idiomsel select { font-size: 20px; min-height: 46px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); padding: 0 8px; }
.wordbank { display: flex; gap: 8px 16px; flex-wrap: wrap; padding: 10px 14px; border: 2px dashed var(--ink-soft); border-radius: 12px; font-size: 20px; }
.lwrow { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; font-size: 30px; font-family: "Comic Sans MS", "Segoe Print", var(--font-body); }
.lwrow input { width: 2em; height: 2em; text-align: center; font-size: 26px; border: 0; border-bottom: 3px solid var(--ink); background: var(--paper); border-radius: 6px 6px 0 0; padding: 0; }
.lwrow .ch { min-width: .7em; text-align: center; }
.say { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; }
/* pads */
.pad { position: relative; width: 100%; border: 2px solid var(--ink); border-radius: 10px; background: #fff; overflow: hidden; touch-action: none; }
.pad canvas { display: block; width: 100%; }
.pad canvas.ink { position: absolute; left: 0; top: 0; touch-action: none; }
.padtools { display: flex; gap: 8px; flex-wrap: wrap; }
.padtools .btn { min-height: 40px; padding: 4px 14px; font-weight: 500; }
.rules { font-size: 14px; color: var(--ink-soft); display: grid; gap: 2px; padding-left: 1.2em; margin: 0; }
.selfmark { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.selfmark .btn { min-height: 44px; }
.selfmark .btn.on { background: var(--green); color: var(--on-solid); border-color: var(--green); }
.selfmark .btn.on.no { background: var(--red); border-color: var(--red); }
textarea.wr { min-height: 84px; font-size: 20px; }
.modelbox { border: 2px solid var(--green); background: color-mix(in srgb, var(--green) 10%, var(--card)); border-radius: 12px; padding: 10px 14px; }
/* flower */

/* 教材上傳表單 */
.narrow { max-width: 600px; margin: 0 auto; width: 100%; }
.form { display: flex; flex-direction: column; gap: 18px; }

.sseg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }

/* ===================================================================
   v3.0 風格：C｜星球探險隊（依「放學小站 風格方向」規格 v0.1）
   Layout concept: 夜空當底，六科是六顆星球；亮色只給按鈕、星星和對錯回饋，
   亮色上的字一律用夜空底色，不用白字。只改外觀，不動內容與功能。
   =================================================================== */
:root {
  color-scheme: dark;
  /* 基礎色 */
  --night: #16213E;      /* 夜空底 */
  --night-hi: #2C3A6B;   /* 夜空亮處 */
  --panel: #1F2C52;      /* 卡片 */
  --panel-in: #24335F;   /* 卡片內的窗 */
  --rim: #34457A;        /* 框線 */
  --txt: #FFFFFF;        /* 主文字 */
  --txt-2: #A9B4D0;      /* 次文字 */
  /* 功能色 */
  --star: #FFD166;       /* 星星／按鈕 */
  --ok: #4ECDC4;         /* 答對 */
  --retry: #FF8C6B;      /* 再試一次 */
  /* 科目星球 */
  --p-chi: #FF8C6B; --p-eng: #FFD166; --p-mat: #6C8CFF; --p-nat: #4ECDC4; --p-soc: #FF9EC7; --p-hea: #C49BFF;
  /* 字體 */
  --font-display: "Chiron GoRound TC", "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Chiron GoRound TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;

  /* 把 2.0 的變數對應到星球色票 */
  --paper: var(--night); --card: var(--panel); --grid: var(--rim);
  --ink: var(--txt); --ink-soft: var(--txt-2); --line: var(--rim);
  --pencil: var(--star); --pencil-ink: var(--night);
  --teal: var(--star); --leaf: var(--star); --leaf-d: var(--star);
  --red: var(--retry); --green: var(--ok); --blue: #9DB2FF; --amber: var(--star); --violet: var(--p-hea);
  --on-solid: var(--night);
}
html, body, body:has(.app.home) { background-color: var(--night); }
body { color: var(--txt); font-family: var(--font-body); background-color: var(--night); position: relative; z-index: 0; isolation: isolate; }

@keyframes skyTw { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

/* 科目色 */
.red { --pc: var(--p-chi); } .blue { --pc: var(--p-eng); } .green { --pc: var(--p-mat); }
.aqua { --pc: var(--p-nat); } .amber { --pc: var(--p-soc); } .violet { --pc: var(--p-hea); }
main { --pc: var(--star); }
main:has(> .wide.red, > .gamebar.red) { --pc: var(--p-chi); }
main:has(> .wide.blue, > .gamebar.blue) { --pc: var(--p-eng); }
main:has(> .wide.green, > .gamebar.green) { --pc: var(--p-mat); }
main:has(> .wide.aqua, > .gamebar.aqua) { --pc: var(--p-nat); }
main:has(> .wide.amber, > .gamebar.amber) { --pc: var(--p-soc); }
main:has(> .wide.violet, > .gamebar.violet) { --pc: var(--p-hea); }

/* ---------- 頁首 ---------- */

.hbar .homebtn h1.logo3 { display: flex; flex-direction: column; font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--txt); line-height: 1.5; }

.mutebtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mutebtn:hover, .mutebtn:focus-visible { background: var(--panel-in); outline: none; }
.mutebtn[aria-pressed="true"] { border-style: dashed; border-color: var(--txt-2); color: var(--txt-2); } /* 靜音時整顆變灰 */
.upbtn[aria-current="true"], .upbtn:hover { background: var(--star); color: var(--night); }

/* ---------- 首頁 ---------- */
.band3 { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 6px 0 0; }

/* 題目 */

.gq-opt .k { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--g-rim); font-size: 14px; display: grid; place-items: center; color: var(--g-txt-2); }

.gq-opt[aria-pressed="true"] { border-color: var(--g-star); background: var(--g-panel-in); }

/* 拼句：火箭貨艙 */
.gq-cargo { position: relative; display: flex; align-items: stretch; justify-content: center; margin: 4px 0 6px; }

.gq-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding-top: 6px; }

.gq .gq-sw[aria-pressed="true"] { outline: 2px solid var(--g-paper-ink); outline-offset: 2px; }

.gq-sheet { flex: 1; position: relative; min-height: 280px; background-color: var(--g-paper); background-image: linear-gradient(var(--g-paper-grid) 1px, transparent 1px), linear-gradient(90deg, var(--g-paper-grid) 1px, transparent 1px); background-size: 24px 24px; cursor: crosshair; touch-action: none; }

.gq-stat { background: var(--g-panel); border: 1.5px solid var(--g-rim); border-radius: 18px; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }

.gq-planet .it.new { animation: gqPopIn .6s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes gqPopIn { from { transform: translate(-50%, -100%) scale(0); } }
.gq-fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

/* 咕嚕 */

@keyframes gqHop { 40% { transform: translateY(-16px); } }

@keyframes gqSpin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) { .gq *, .gq *::before, .gq *::after { animation: none !important; transition: none !important; } }
@media (max-width: 680px) { .gq-num { grid-template-columns: 1fr; } .gq-scratch { min-height: 300px; } }

  .gq-qt h2 { font-size: 22px; }

}

/* 氣球模式 */

.gq-opt.bal::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 26px; background: var(--g-txt-2); }
.gq-opt.bal.c1 { --bc: #FFD166; } .gq-opt.bal.c2 { --bc: #4ECDC4; } .gq-opt.bal.c3 { --bc: #C49BFF; }
.gq-opt.bal[aria-pressed="true"] { border-color: #FFFFFF; outline: 4px solid var(--g-star); outline-offset: 3px; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.8) 0 7%, transparent 8%), var(--bc); }
.gq-opt.bal.right { border-color: #FFFFFF; outline: 4px solid var(--g-ok); outline-offset: 3px; }
.gq-opt.bal.wrong { opacity: .45; outline: 4px solid var(--g-retry); outline-offset: 3px; }

@keyframes gqBob { 50% { transform: translateY(-12px); } }
@keyframes gqBalPop { 40% { transform: scale(1.3); } 100% { transform: scale(1.6); opacity: 0; } }

/* 看做過的題目 */
.gq-act { gap: 12px; align-items: center; }
.gq .gq-rev { margin-right: auto; color: var(--g-txt-2); font-size: 15px; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--g-rim); }

.gq-revans b.ok { color: var(--g-ok); } .gq-revans b.no { color: var(--g-retry); }

/* 翻牌配對、口試練習裡的火箭航線和咕嚕 */
.gq.gq-inline { padding-bottom: 0; gap: 10px; max-width: none; }

/* 闖關問答開始畫面 */
.gq-guru .pillow { display: none; }
.gq-guru[data-mood="sleep"].pillowed .pillow { display: inline; }
.gq-introtop { display: flex; }
/* 返回鍵統一用網站的 .backlink 樣式 */
.gq-top .backlink, .gq-introtop .backlink { margin-top: 0; flex: none; }
.gq-topwrap { display: flex; flex-direction: column; gap: 10px; } /* 返回在上，火箭進度條在下一行 */
.gq-topwrap .backlink { margin-top: 0; }
.gq.gq-inline > .gq-route { flex: none; height: 44px; width: 100%; } /* 直排時進度條要保留高度，不然會跟返回疊在一起 */
.gq.gq-inline > .backlink { margin-top: 0; }
.gq-hero { display: flex; align-items: center; gap: 18px; }
.gq-hero .gq-guru { flex: none; cursor: pointer; }
.app main .gq .gq-hero h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1.3; }
.gq-hero p { color: var(--g-txt-2); }
.gq .gq-pick { --pc: var(--g-star); text-align: left; background: var(--g-panel); border: 1.5px solid var(--g-rim); border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; transition: transform .15s, border-color .15s; }
.gq .gq-pick:hover { transform: translateY(-3px); border-color: var(--pc); }
.gq-pick .tag { align-self: flex-start; background: var(--pc); color: var(--g-night); font-size: 13px; font-weight: 700; padding: 2px 12px; border-radius: 999px; }
.app main .gq .gq-pick h2 { font-size: 26px; }
.gq-pick p { color: var(--g-txt-2); font-size: 14px; }
.gq-rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.gq-rule { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--g-txt-2); }
.gq-rule i { font-style: normal; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--g-panel-in); border: 1px solid var(--g-rim); display: grid; place-items: center; font-size: 17px; }
.gq-rule b { color: var(--g-txt); display: block; font-size: 15px; }
.gq-inline .gq-garden { padding: 12px 18px; }
.gq.gq-toprow { flex-direction: row; align-items: center; gap: 14px; } /* 返回和火箭航線排成一列 */
.gq-toprow .backlink { margin-top: 0; flex: none; }
.gq-toprow .gq-route { flex: 1; }
.wide > .gq.gq-inline:last-child { margin-top: 20px !important; } /* 我的小星球和上方遊戲卡多空 20px */
@media (max-width: 520px) { .gq-hero .gq-guru { width: 96px !important; } .gq-hero .gq-guru svg { height: 89px !important; } /* 縮小時高度跟著縮，咕嚕才是圓的 */ .app main .gq .gq-hero h1 { font-size: 27px; } }

/* 玩遊戲頁：右下角浮動的我的小星球 */
.gq.gq-float { position: fixed; z-index: 40; right: max(20px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: none; margin: 0; padding: 0; gap: 0; display: flex; flex-direction: column; align-items: flex-end; pointer-events: none; animation: gqFloat 4.5s ease-in-out infinite; }
.gq-floatsay { position: relative; margin-right: 20px; margin-bottom: -10px; z-index: 1; background: #FFFFFF; color: var(--g-night); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 14px; white-space: nowrap; animation: gqSay 4.5s ease-in-out infinite; }
.gq-floatsay::after { content: ""; position: absolute; right: 34px; bottom: -7px; width: 14px; height: 14px; background: #FFFFFF; transform: rotate(45deg); border-radius: 2px; }
.gq-floatball { width: 168px; height: 168px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2C3A6B, var(--g-panel) 70%); border: 4px solid rgba(255,255,255,.85); display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(255,209,102,.25), 0 0 30px rgba(78,205,196,.35); }
.gq-floatball .gq-planet { animation: gqSpinSlow 18s linear infinite; transform-origin: 50% 58%; }
@keyframes gqFloat { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
@keyframes gqSay { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes gqSpinSlow { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
/* 手機（直式或橫式）：平常只露出一顆小星球，點了才打開 */
.gq-floatmin { display: none; }
@media (max-width: 640px), (max-height: 500px) {
  .gq.gq-float { right: max(12px, calc(env(safe-area-inset-right, 0px) + 8px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .gq-floatbody { display: none; }
  .gq-floatmin { display: grid; place-items: center; pointer-events: auto; width: 54px; height: 54px; border-radius: 50%; padding: 0; background: radial-gradient(circle at 50% 40%, #2C3A6B, var(--g-panel) 70%); border: 3px solid rgba(255,255,255,.85); box-shadow: 0 0 0 4px rgba(255,209,102,.25), 0 4px 14px rgba(0,0,0,.35); cursor: pointer; overflow: hidden; }
  .gq-floatmin { position: relative; }
  .gq-floatmin .gq-planet { position: absolute; left: 50%; top: 50%; margin: -64px 0 0 -60px; transform: scale(.42); }
  .gq.gq-float.open .gq-floatmin { display: none; }
  .gq.gq-float.open .gq-floatball { position: relative; }
  .gq.gq-float.open .gq-floatball::after { content: "✕"; position: absolute; top: -4px; right: -4px; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; color: var(--g-night); font-size: 15px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .gq.gq-float.open .gq-floatbody { display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto; cursor: pointer; margin-bottom: 10px; }
  .gq.gq-float.open .gq-floatsay { white-space: normal; max-width: 200px; margin-right: 6px; }
  .gq.gq-float.open .gq-floatsay::after { right: 30px; }
  .gq.gq-float.open .gq-floatball { width: 120px; height: 120px; border-width: 3px; }
  .gq.gq-float.open .gq-floatball .gq-planet { transform: scale(.8); animation: none; }
}
@media (prefers-reduced-motion: reduce) { .gq.gq-float, .gq-floatsay, .gq-floatball .gq-planet { animation: none; } }

.gq .gq-tb.gq-clr { width: auto; padding: 0 10px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; } /* 全部清除：圖示加文字 */

.gq-opts:not(.balloons), .gq-fill, .gq-cargo { margin-top: 30px; } /* 題目和答案按鈕之間多空 30px（全網同步） */

/* ===== 手機版（第二輪） ===== */
.intro-tg { display: none; }
@media (max-width: 560px) {
  /* 闖關問答／氣球：確認答案在上、看做過的題目在下 */
  .gq-act { flex-direction: column-reverse; align-items: stretch; }
  .gq .gq-rev { margin-right: 0; text-align: center; }
  /* 考試說明：可以收合，預設收起來 */
  .intro.fold > h2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
  .intro.fold .intro-tg { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--rim, #34457A); background: transparent; color: inherit; padding: 0; }
  .intro.fold .intro-tg::before { content: ""; width: 9px; height: 9px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: translateY(-2px) rotate(45deg); }
  .intro.fold.open .intro-tg::before { transform: translateY(2px) rotate(-135deg); }
  .intro.fold:not(.open) > :not(h2) { display: none; }
  /* 口試練習：圖示和文字靠近一點，下面兩個按鈕才看得到 */
  .oitem.big { gap: 0; padding: 12px 16px; min-height: 0; }
  .oitem.big .oicon { width: 104px; height: 78px; }
  .oitem.big.word .otext { line-height: 1.15; }
}

/* 遊戲清單（樣式同咕嚕遊戲試玩館） */
.glwrap { display: flex; flex-direction: column; gap: 22px; margin-top: 4px; }
.glhd { display: flex; align-items: center; gap: 16px; }
.glhd .gq-guru { flex: none; }
.app main .glhd h2 { display: block; font-family: var(--font-display); font-weight: 400; font-size: 32px; color: var(--txt); margin: 0; line-height: 1.3; }
.app main .glhd h2::before { content: none; display: none; }
.glhd p { color: var(--txt-2); font-size: 15px; }
.glzone { display: flex; flex-direction: column; gap: 12px; --pc: var(--star); }
.glzone.eng { --pc: var(--p-eng); } .glzone.mat { --pc: var(--p-mat); } .glzone.chi { --pc: var(--p-chi); } .glzone.nat { --pc: var(--p-nat); } .glzone.hea { --pc: var(--p-hea); }
.app main .glzone h3 { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--txt); display: flex; align-items: center; gap: 10px; margin: 0; }
.glzone h3 i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); flex: none; }
.glcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.glcard { --pc: var(--star); text-align: left; background: var(--panel); border: 1.5px solid var(--rim) !important; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--txt); font: inherit; transition: transform .15s, border-color .15s; }
button.glcard { cursor: pointer; }

  /* 四位數加減：最多只進位或借位一次，數字不要太大 */
  function genAddSub() {
    var plus = Math.random() < 0.5, at = rnd(0, 2), A = [0, 0, 0, 0], B = [0, 0, 0, 0], p;
    if (plus) {
      /* at = 0 不進位；1 個位進位；2 十位進位 */
      for (p = 0; p < 3; p++) {
        if (at && p === at - 1) { A[p] = rnd(5, 9); B[p] = rnd(10 - A[p], 9); }
        else { A[p] = rnd(0, 6); B[p] = rnd(0, 7 - A[p]); }
      }
      A[3] = rnd(1, 4); B[3] = rnd(1, 7 - A[3]);
    } else {
      /* at = 0 不借位；1 個位借位；2 十位借位 */
      A[3] = rnd(3, 8); B[3] = rnd(1, A[3] - 1);
      for (p = 0; p < 3; p++) {
        if (at && p === at - 1) { A[p] = rnd(0, 4); B[p] = rnd(A[p] + 1, 8); }
        else if (at && p === at) { A[p] = rnd(2, 9); B[p] = rnd(0, A[p] - 1); }
        else { A[p] = rnd(1, 9); B[p] = rnd(0, A[p]); }
      }
    }
    var num = function (D) { return D[3] * 1000 + D[2] * 100 + D[1] * 10 + D[0]; };
    var a = num(A), b2 = num(B), ans = plus ? a + b2 : a - b2;
    var wrong = [ans + 10, ans - 10, ans + 100, ans - 100].filter(function (x) { return x > 0 && x < 10000; });
    return { q: a + (plus ? ' + ' : ' − ') + b2, ans: ans, opts: shuffle([ans].concat(shuffle(wrong).slice(0, 2))) };
  }
